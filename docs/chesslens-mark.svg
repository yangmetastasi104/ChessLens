<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ChessLens</title>
  <desc id="desc">A green chess knight framed by a glowing lens on a midnight blue square.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="18" x2="232" y2="242" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172554"/>
